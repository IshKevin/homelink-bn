services:
  postgres:
    image: postgres:16
    container_name: homelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homelink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: homelink-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    container_name: homelink-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit
    container_name: homelink-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # One-off: applies pending drizzle migrations, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        IMAGE_TAG: ${IMAGE_TAG:-local}
    container_name: homelink-migrate
    command: ["npm", "run", "db:migrate"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-off: creates (or promotes/resets) the admin account from ADMIN_EMAIL/ADMIN_PASSWORD, then exits.
  # Skips itself if those two vars aren't set.
  seed-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        IMAGE_TAG: ${IMAGE_TAG:-local}
    container_name: homelink-seed-admin
    command: ["npm", "run", "seed:admin"]
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        IMAGE_TAG: ${IMAGE_TAG:-local}
    container_name: homelink-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-admin:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        IMAGE_TAG: ${IMAGE_TAG:-local}
    container_name: homelink-worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:

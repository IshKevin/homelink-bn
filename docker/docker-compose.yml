version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homelink-api
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16
    container_name: homelink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homelink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: homelink-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: homelink-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit
    container_name: homelink-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
  miniodata: